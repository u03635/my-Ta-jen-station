                    <div class="ep-meta-row">
                        <span class="ep-badge">EP.${ep.ep}</span>
                        <span class="ep-cat-tag">${ep.category_name}</span>
                    </div>
                    <div class="ep-list-title">${ep.title.replace(/^EP\.\d+｜?/, '').trim()}</div>
                    <div class="ep-list-desc">${ep.summary}</div>
                </li>
            `).join("");

            document.querySelectorAll(".episode-item").forEach(item => {
                item.addEventListener("click", () => {
                    const epId = item.getAttribute("data-id");
                    selectEpisode(epId);
                    sidebar.classList.remove("open");
                    sidebarOverlay.classList.remove("active");
                });
            });
        }

        function selectEpisode(epId) {
            currentEpisodeId = epId;
            window.location.hash = epId;
            renderSidebar();
            renderEpisodeDetail(epId);
            contentView.scrollTo({ top: 0, behavior: "smooth" });
        }

        function renderEpisodeDetail(epId) {
            const ep = EPISODES.find(e => e.id === epId) || EPISODES[0];
            const currentIndex = EPISODES.findIndex(e => e.id === ep.id);
            const prevEp = currentIndex > 0 ? EPISODES[currentIndex - 1] : null;
            const nextEp = currentIndex < EPISODES.length - 1 ? EPISODES[currentIndex + 1] : null;

            let researchHtml = "";
            if (ep.research_data && ep.research_data.length > 0) {
                researchHtml = `
                    <section class="article-section">
                        <h3 class="section-header-title"><span class="icon">📊</span> 研究與歷史數據驗證</h3>
                        <ul class="data-list">
                            ${ep.research_data.map(item => `<li>${item}</li>`).join("")}
                        </ul>
                    </section>
                `;
            }

            let caseHtml = "";
            if (ep.case_studies && ep.case_studies.length > 0) {
                caseHtml = `
                    <section class="article-section">
                        <h3 class="section-header-title"><span class="icon">💼</span> 經典案例與情境對比</h3>
                        <div class="data-table-container">
                            <table class="styled-table">
                                <thead>
                                    <tr>
                                        <th style="width:25%;">情境模式</th>
                                        <th>詳細解析與財務含義</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${ep.case_studies.map(c => `
                                        <tr>
                                            <td><strong>${c.scenario}</strong></td>
                                            <td>${c.detail}</td>
                                        </tr>
                                    `).join("")}
                                </tbody>
                            </table>
                        </div>
                    </section>
                `;
            }

            contentContainerEl.innerHTML = `
                <article>
                    <div class="article-header">
                        <div class="ep-headline-badge">
                            <span class="cat-pill-hero">${ep.category_name}</span>
                            <span style="font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:var(--text-muted);">
                                EPISODE #${ep.ep}
                            </span>
                        </div>
                        <h1 class="article-title">${ep.title}</h1>
                        <div class="article-quick-nav">
                            <button class="btn" id="copyShareBtn">🔗 複製分享連結</button>
                            <div style="font-size:0.82rem;color:var(--text-muted);">槓桿思維・長期投資・資產配置</div>
                        </div>
                    </div>

                    <section class="article-section">
                        <h3 class="section-header-title"><span class="icon">💡</span> 本集核心大綱與破題</h3>
                        <p class="summary-text">${ep.summary}</p>
                    </section>

                    <section class="article-section">
                        <h3 class="section-header-title"><span class="icon">🔑</span> 本集精選 Top 觀念提煉</h3>
                        <ol class="top-list">
                            ${ep.top_takeaways.map(item => `<li>${item}</li>`).join("")}
                        </ol>
                    </section>

                    <section class="article-section">
                        <h3 class="section-header-title"><span class="icon">🧠</span> 重要金融名詞與認知概念</h3>
                        <div class="concepts-grid">
                            ${ep.key_concepts.map(k => `
                                <div class="concept-card">
                                    <h4>${k.term}</h4>
                                    <p>${k.desc}</p>
                                </div>
                            `).join("")}
                        </div>
                    </section>

                    ${researchHtml}
                    ${caseHtml}

                    <section class="article-section" style="padding:0;background:none;border:none;box-shadow:none;">
                        <div class="action-box">
                            <div class="action-box-icon">🎯</div>
                            <div class="action-box-content">
                                <h4>實戰投資與人生行動指引</h4>
                                <p>${ep.action_guide}</p>
                            </div>
                        </div>
                    </section>

                    <div class="bottom-pager">
                        ${prevEp ? `<button class="btn" onclick="selectEpisode('${prevEp.id}')">⬅ 上一集：EP.${prevEp.ep}</button>` : `<div></div>`}
                        ${nextEp ? `<button class="btn btn-primary" onclick="selectEpisode('${nextEp.id}')">下一集：EP.${nextEp.ep} ➡</button>` : `<div></div>`}
                    </div>
                </article>
            `;

            const copyShareBtn = document.getElementById("copyShareBtn");
            if (copyShareBtn) {
                copyShareBtn.addEventListener("click", () => {
                    const shareUrl = window.location.origin + window.location.pathname + "#" + ep.id;
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        copyShareBtn.textContent = "✅ 已複製連結！";
                        setTimeout(() => { copyShareBtn.textContent = "🔗 複製分享連結"; }, 2000);
                    });
                });
            }
        }

        function setupEventListeners() {
            searchInput.addEventListener("input", (e) => {
                searchQuery = e.target.value;
                clearSearchBtn.style.display = searchQuery ? "block" : "none";
                renderSidebar();
            });

            clearSearchBtn.addEventListener("click", () => {
                searchInput.value = "";
                searchQuery = "";
                clearSearchBtn.style.display = "none";
                renderSidebar();
            });

            categoryBar.addEventListener("click", (e) => {
                if (e.target.classList.contains("filter-pill")) {
                    document.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
                    e.target.classList.add("active");
                    activeCategory = e.target.getAttribute("data-cat");
                    renderSidebar();
                }
            });

            themeToggle.addEventListener("click", () => {
                const cur = document.documentElement.getAttribute("data-theme");
                applyTheme(cur === "dark" ? "light" : "dark");
            });

            menuToggle.addEventListener("click", () => {
                sidebar.classList.toggle("open");
                sidebarOverlay.classList.toggle("active");
            });

            sidebarOverlay.addEventListener("click", () => {
                sidebar.classList.remove("open");
                sidebarOverlay.classList.remove("active");
            });

            window.addEventListener("hashchange", () => {
                const hashId = window.location.hash.replace("#", "");
                if (hashId && hashId !== currentEpisodeId && EPISODES.some(e => e.id === hashId)) {
                    selectEpisode(hashId);
                }
            });
        }

        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
