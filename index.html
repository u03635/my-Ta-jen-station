<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>槓桿精油站｜大仁來開槓 EP.10～EP.50 完整精華整理</title>
    <meta name="description" content="大仁來開槓 Podcast EP.10 ~ EP.50 核心知識庫、生命週期投資法、槓桿ETF（0050正2）、房貸信貸資產配置、報酬順序風險全集精華整理。">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root[data-theme="dark"] {
            --bg-body: #121316;
            --bg-sidebar: #181a1f;
            --bg-card: #20232a;
            --bg-card-hover: #282c35;
            --border-color: #2e333d;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --primary: #f59e0b;
            --primary-rgb: 245, 158, 11;
            --primary-hover: #d97706;
            --accent-red: #ef4444;
            --accent-blue: #38bdf8;
            --tag-bg: rgba(245, 158, 11, 0.12);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --header-bg: rgba(24, 26, 31, 0.85);
        }

        :root[data-theme="light"] {
            --bg-body: #f8fafc;
            --bg-sidebar: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --border-color: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #d97706;
            --primary-rgb: 217, 119, 6;
            --primary-hover: #b45309;
            --accent-red: #dc2626;
            --accent-blue: #0284c7;
            --tag-bg: rgba(217, 119, 6, 0.1);
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --header-bg: rgba(255, 255, 255, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.7;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        header.app-header {
            height: 64px;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            z-index: 100;
            flex-shrink: 0;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-logo-icon {
            font-size: 1.6rem;
            line-height: 1;
        }

        .header-title-box h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-title-box p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .badge-count {
            background: var(--tag-bg);
            color: var(--primary);
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 9999px;
            font-weight: 600;
            border: 1px solid rgba(var(--primary-rgb), 0.25);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 0.85rem;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn:hover {
            background: var(--bg-card-hover);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff !important;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.25rem;
        }

        .app-body {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        aside.sidebar {
            width: 380px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.3s ease;
            z-index: 90;
        }

        .sidebar-search-box {
            padding: 1rem 1.25rem 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 0.85rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 0.55rem 2rem 0.55rem 2.2rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .clear-search-btn {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            display: none;
        }

        .category-filter-bar {
            display: flex;
            gap: 0.4rem;
            overflow-x: auto;
            padding: 0.5rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }

        .category-filter-bar::-webkit-scrollbar {
            display: none;
        }

        .filter-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-pill:hover,
        .filter-pill.active {
            background: var(--tag-bg);
            color: var(--primary);
            border-color: var(--primary);
            font-weight: 600;
        }

        .episode-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0;
            list-style: none;
        }

        .episode-item {
            padding: 0.85rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            position: relative;
        }

        .episode-item:hover {
            background: var(--bg-card-hover);
        }

        .episode-item.active {
            background: var(--bg-card);
            border-left: 4px solid var(--primary);
            padding-left: calc(1.25rem - 4px);
        }

        .ep-meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.35rem;
        }

        .ep-badge {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
        }

        .ep-cat-tag {
            font-size: 0.68rem;
            padding: 0.1rem 0.45rem;
            border-radius: 4px;
            background: var(--border-color);
            color: var(--text-muted);
        }

        .ep-list-title {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .ep-list-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        main.content-view {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 3rem 4rem;
            background: var(--bg-body);
        }

        .content-container {
            max-width: 880px;
            margin: 0 auto;
        }

        .article-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .ep-headline-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .cat-pill-hero {
            background: var(--tag-bg);
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            border: 1px solid rgba(var(--primary-rgb), 0.3);
        }

        .article-title {
            font-size: 1.85rem;
            font-weight: 900;
            line-height: 1.35;
            color: var(--text-main);
            margin-bottom: 1rem;
        }

        .article-quick-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px dashed var(--border-color);
        }

        .article-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.75rem 2rem;
            margin-bottom: 1.75rem;
            box-shadow: var(--shadow);
        }

        .section-header-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 0.6rem;
            margin-bottom: 1.25rem;
        }

        .section-header-title .icon {
            font-size: 1.3rem;
        }

        p.summary-text {
            font-size: 0.98rem;
            line-height: 1.8;
            color: var(--text-main);
        }

        ol.top-list {
            padding-left: 0;
            list-style: none;
            counter-reset: top-counter;
        }

        ol.top-list li {
            position: relative;
            padding-left: 2.2rem;
            margin-bottom: 0.85rem;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        ol.top-list li::before {
            counter-increment: top-counter;
            content: counter(top-counter);
            position: absolute;
            left: 0;
            top: 0.2rem;
            width: 1.45rem;
            height: 1.45rem;
            background: var(--tag-bg);
            color: var(--primary);
            border: 1px solid rgba(var(--primary-rgb), 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .concepts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
        }

        .concept-card {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem 1.2rem;
        }

        .concept-card h4 {
            font-size: 0.95rem;
            color: var(--primary);
            margin-bottom: 0.4rem;
            font-weight: 700;
        }

        .concept-card p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .data-table-container {
            overflow-x: auto;
            margin-top: 1rem;
        }

        table.styled-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        table.styled-table th,
        table.styled-table td {
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            text-align: left;
        }

        table.styled-table th {
            background: var(--bg-body);
            color: var(--text-main);
            font-weight: 700;
        }

        table.styled-table tr:hover {
            background: var(--bg-card-hover);
        }

        ul.data-list {
            padding-left: 1.25rem;
        }

        ul.data-list li {
            margin-bottom: 0.75rem;
            font-size: 0.92rem;
            line-height: 1.65;
        }

        .action-box {
            background: linear-gradient(135deg, rgba(var(--primary-rgb), 0.08) 0%, rgba(var(--primary-rgb), 0.02) 100%);
            border: 1px solid rgba(var(--primary-rgb), 0.3);
            border-radius: 10px;
            padding: 1.25rem 1.5rem;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .action-box-icon {
            font-size: 1.8rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .action-box-content h4 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.3rem;
        }

        .action-box-content p {
            font-size: 0.92rem;
            color: var(--text-main);
            line-height: 1.65;
        }

        .bottom-pager {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            gap: 1rem;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 64px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 80;
        }

        @media (max-width: 900px) {
            aside.sidebar {
                position: fixed;
                top: 64px;
                bottom: 0;
                left: 0;
                transform: translateX(-100%);
                box-shadow: 4px 0 20px rgba(0,0,0,0.5);
            }

            aside.sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay.active {
                display: block;
            }

            .menu-toggle {
                display: block;
            }

            main.content-view {
                padding: 1.5rem 1rem 3rem;
            }

            .article-title {
                font-size: 1.45rem;
            }

            .article-section {
                padding: 1.25rem 1.25rem;
            }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="header-brand">
            <button class="menu-toggle" id="menuToggle" aria-label="切換目錄選單">☰</button>
            <div class="header-logo-icon">📈</div>
            <div class="header-title-box">
                <h1>槓桿精油站 <span class="badge-count">EP.10 ~ EP.50</span></h1>
                <p>大仁來開槓系列・投資理財與槓桿思維核心資料庫</p>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn" id="themeToggle" title="切換深淺色彩模式">
                <span id="themeIcon">☀️</span>
                <span id="themeText">切換亮色</span>
            </button>
        </div>
    </header>

    <div class="app-body">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-search-box">
                <div class="search-input-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="搜尋集數、標題、名詞、關鍵字...">
                    <button id="clearSearch" class="clear-search-btn">✕</button>
                </div>
            </div>

            <div class="category-filter-bar" id="categoryBar">
                <button class="filter-pill active" data-cat="all">全部 (41)</button>
                <button class="filter-pill" data-cat="leverage">槓桿與正二</button>
                <button class="filter-pill" data-cat="debt">房產與負債</button>
                <button class="filter-pill" data-cat="sequence">報酬順序</button>
                <button class="filter-pill" data-cat="mindset">思維與認知</button>
            </div>

            <ul class="episode-list" id="episodeList">
                <!-- 動態注入集數列表 -->
            </ul>
        </aside>

        <main class="content-view" id="contentView">
            <div class="content-container" id="contentContainer">
                <!-- 動態注入詳細內容 -->
            </div>
        </main>
    </div>

    <script>
        // 41 集完整精華資料庫 (EP.10 ~ EP.50)

</body>
</html>
