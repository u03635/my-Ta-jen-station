    <script>
        const EPISODES = [{"id": "ep10", "ep": 10, "title": "EP.10｜主動型 ETF 可以買嗎｜敷衍了事才能完事", "category": "mindset", "category_name": "投資思維與認知", "outline": "本集探討大仁重啟 Podcast 的創作心路歷程與《化解你的時間焦慮》中的「敷衍了事」生活哲學，並切入投資界熱議的「主動型 ETF / 基金到底能不能買」。大仁從被動指數的股票溢酬依據出發，對比主動基金長期 90% 落後大盤的客觀歷史數據，提出檢視主動投資的「四個靈魂問題」，剖析 2023 高股息大漲源自 AI 爆發而非高股息因子的迷思，並從資產配置與台股台積電比重過高的扭曲結構，客觀分析主動型標的的合理配置比例與「只賺認知以內錢」的投資心態。", "deep_dive": "[00:00:04] 重啟 Podcast 的心路與逃避心理：大仁分享睽違一年多重啟錄音的原因，坦言自己過去一年為了逃避完成新書《淺談投資》與《槓桿致富》的校稿排版，陷入完美主義與拖延症的惡性循環。當生活被兩個小孩切碎時間，大腦總惦記著瑣事而無法進入深度的法式料理般精雕細琢的寫作狀態。\n\n[00:10:11] 自私的寫作與語言表達的挑戰：引用摩根·豪瑟（Morgan Housel）的觀點，真正的創作應當是「自私」的，自己才是文章的第一個也是最想看的人。分析文章寫作講求呼吸節奏感，而 Podcast 則像即興發揮的無菜單料理，有著無法回頭修改的時間限制，兩者心智模式容易產生拉扯。\n\n[00:16:21] 《化解你的時間焦慮》與「敷衍了事」哲學：回顧書中觀念——並非每件事都必須做到完美，追求最高標準往往讓人裹足不前。「敷衍了事」的核心在於將精力集中在真正重要的幾件事上，接受夠好即可。由此延伸至人生的決策模式：選擇「短期簡單」的事（如吃垃圾食物、錢全放定存），長期將會面臨通膨侵蝕與健康惡化等越來越困難的結局；反之，選擇「短期困難」的事（如健康飲食、理解槓桿與承受波動），建立起成長型思維與心理韌性，長期的人生與投資反而會越走越輕鬆。\n\n[00:25:09] 主動型 ETF 與被動指數的底層差異：被動指數背後有全體市場長期的「股票風險溢酬」作為學術與歷史依據，而主動型基金唯一的依據只有經理人過去的績效。根據統計，在 15 年的連續時間跨度中，美國超過 90% 的主動型基金都會落後基準指數。2023 年高股息 ETF 暴漲並非因為高股息因子，而是運氣好重倉了搭上 AI 熱潮的大牛股，若因結果論誤判原因，當 2024~2025 年高股息大幅落後市值型時，投資人便會陷入嚴重的內心動搖。\n\n[00:33:38] 挑選主動型基金的「四個靈魂拷問」：1. 經理人的能力是否真的頂尖？2. 自己是否有眼光在未成名時就挑中他？3. 在他日落西山、績效陷入低谷時，自己能否堅定持有陪伴他？4. 熬過低谷後，他能否打破常規如奧運選手般連霸奪牌？唯有能承受這四層巨大不確定性的人，才配得上主動投資的超額報酬。\n\n[00:36:15] 台股結構扭曲與主動型 ETF 的資產配置定位：台股市值高度集中於台積電（大盤佔 40% 以上、0050 佔 60% 以上），系統存在結構性偏斜。若為了分散單一公司風險，將部分資金（如 5%~10%）配置於主動型標的（如統一 00981A）或作為投資吉祥物，在資產配置角度是完全合理的。投資沒有非黑即白，關鍵在於配置比例與承受不確定性的能力，永遠記住：人只能賺到自己認知範圍以內的錢。", "top10": ["真正的寫作與表達應當是「自私」的，自己才是第一位想從中獲取價值與啟發的受眾 [00:11:13]。", "「敷衍了事」不是偷懶，而是將有限的認知帶寬保留給人生最核心的幾件大事 [00:16:59]。", "選擇短期簡單的事（如只存定存），長期往往越來越困難；選擇短期困難的事（如學習資產配置與槓桿），長期人生會越來越輕鬆 [00:19:27]。", "人要具備「成長型思維」，不要害怕初期表現笨拙，能力是透過長期刻意練習累積出來的 [00:22:51]。", "長期統計顯示，在 15 年週期中超過 90% 的主動型基金都落後其基準被動指數 [00:25:39]。", "判斷投資不要看「結果論」，賺到錢若不知道為什麼賺（如 2023 高股息誤搭 AI 順風車），落後時必然心態崩潰 [00:29:58]。", "挑選主動型基金需面臨四大考驗：經理人能力、挑選眼光、低谷期陪伴、以及能否持續奪牌 [00:33:38]。", "台股當前台積電權重過高（40%~60%），若出於分散集中度考量，配置小比例主動型標的符合資產配置邏輯 [00:36:25]。", "投資沒有非黑即白的絕對禁忌，一切取決於「配置比例」與個人承擔不確定性的信念強度 [00:39:34]。", "每個人都只能賺到自己認知範圍以內的錢，羨慕他人賺取認知外的暴利只會打亂自己的長期節奏 [00:41:29]。"], "books": ["《致富心態》（The Psychology of Money）作者：摩根·豪瑟（Morgan Housel）。書中提出「寫作應當是自私的」與「世界上沒有人是瘋子，每個人的財務決策背後都有其脈絡」[00:10:15]、[00:31:22]。", "《化解你的時間焦慮》書中提出「敷衍了事」哲學，說明把事情做到足夠好即可，追求完美反而會讓人止步不前 [00:16:21]。", "《淺談投資》、《槓桿致富》作者：大仁（林政華）。預告兩本即將出版的新書，分別探討長期投資心態與槓桿降險的底層邏輯 [00:01:08]。"], "research_data": ["SPIVA 歷史統計數據：美國連續 15 年時間跨度中，超過 90% 的主動型基金績效落後於對應的被動基準指數 [00:25:39]。", "全球股票風險溢酬之謎（Equity Premium Puzzle）：跨國跨百年統計顯示，幾乎全世界所有國家的股票長期實質回報皆穩定跑贏無風險資產與債券 [00:26:26]。", "台股市值集中度現狀：台股加權指數中台積電權重超過 40%，而在 0050 等大型權值 ETF 中台積電佔比更超過 60% [00:36:25]。"], "cases": [{"scenario": "2023 高股息 ETF 暴漲的倖存者偏差", "detail": "2023 年高股息績效大勝市值型，市場誤以為是高股息選股邏輯優越，實質上是因為成分股恰巧受惠於 AI 概念股暴衝。到了 2024~2025 年 AI 權值回歸市值型龍頭，高股息大幅落後，不知其所以然的投資人隨即陷入信念動搖 [00:28:38]。"}, {"scenario": "統一主動型 ETF（00981A）暴漲對比 0050正2", "detail": "市場熱烈討論新掛牌的主動型標的單日漲幅是加權指數的數倍，許多人宣稱「買主動型就好何必買正2」。大仁剖析正2承擔的是大盤 2 倍波動，而主動型暴賺數倍背後所承擔的選股與風格漂移風險往往被大眾忽視 [00:38:28]。"}], "terms": [{"term": "主動型 ETF (Active ETF)", "desc": "由經理人與研究團隊主動選股操作、試圖獲取超越大盤 alpha 收益的交易所買賣基金，管理費較高且承擔經理人決策風險 [00:25:13]。"}, {"term": "敷衍了事 (Satisficing / Good Enough)", "desc": "源自決策理論與時間管理，指面對非核心事務時採取「足夠好」的標準，避免完美主義帶來的決策疲勞與拖延 [00:16:30]。"}, {"term": "股票風險溢酬 (Equity Risk Premium)", "desc": "投資人因承擔股市系統性波動風險，相對於無風險利率（如公債或定存）所要求獲得的長期超額回報 [00:26:47]。"}, {"term": "成長型思維 (Growth Mindset)", "desc": "由心理學家卡蘿·杜維克提出，相信能力與心智可透過後天學習與刻意練習不斷提升，而非受先天稟賦限制 [00:22:51]。"}]}, {"id": "ep11", "ep": 11, "title": "EP.11｜過去報酬可以代表未來｜長期堅持比熱情更重要", "category": "mindset", "category_name": "投資思維與認知", "outline": "深入討論歷史數據在投資中的真正意義。大仁透過自身 2012 年家裡揹負 220 萬高利保單貸款瀕臨崩潰的真實經歷，反駁外界對槓桿的輕浮質疑；同時以第一性原理直球對決主動型基金的「倖存者偏差」與雙向擇時幻覺。本集結合《選擇障礙世代》的深度解析，探討現代人為何在無限瀏覽中不敢承諾，指出真正的長期複利來自於在低谷中的彼此修復與堅定堅守。", "deep_dive": "[00:00:09] 錄音工具升級與降低心理摩擦：大仁分享第 10 集順利播出後的信心重塑。過去錄音常因桌上型大麥克風連接繁瑣、環境噪音與手動剪接耗時而中途放棄。這次改用領夾式降噪麥克風、語音暫停自動斷句軟體，並結合 AI 工具自動修剪 250 處空白贅詞，將數小時的後製縮短至 5 分鐘。消除麻煩，行動就會順暢。\n\n[00:07:12] 《牧羊少年奇幻之旅》與拒絕盲目追求熱情：引用名著觀點「當你真心渴望一件事情時，整個宇宙都會聯合起來幫助你」。同時打破社會常講的「尋找熱情」迷思，指出人不必然天生對某事有熱情，而是先腳踏實地做好手頭上的事，從中累積小成就感，進而激發更強動機，形成正向強化循環。\n\n[00:08:53] 大仁的真實負債血淚史：保單貸款 220 萬的危機：坦露 2012 年家中的財務危機——母親向保險公司辦理保單貸款累積達 220 幾萬，利率高達 6.9%（接近 7%），每年光利息支出就超過 15 萬元。當時大仁在寶雅擔任收銀員，月薪僅 2.2 萬，全家年收入約 80 萬，但每年需支付 60 萬保費與 15 萬利息，幾乎陷入全家破產絕境。這段被高利負債逼到懸崖邊的痛苦經驗，逼迫他耗費數年徹夜苦讀保險法規與條款，最終靠自身專業化解危機。大仁反駁外界對他提倡槓桿是「不顧風險」的質疑，笑稱自己被 AI 評為「風險管理之柱」，正是親歷過負債深淵，才最清楚負債的邊界與安全邊際。\n\n[00:16:13] 主動型基金的倖存者偏差與「過去代表未來」的荒謬：針對市場瘋搶統一 00981A 等熱門主動基金的現象進行剖析。許多人以「統一、野村過去幾年報酬率超高」為由進場，忽視了大量已經落後或遭清算的平庸主動基金，犯下標準的「倖存者偏差」。大仁直球對決：若純粹以過去高報酬作為唯一買進理由，那麼美股兩倍半導體 USD（累積報酬 10,000%）、三倍半導體 SOXL（累積報酬 15,000%）與 TQQQ 的歷史報酬遠超任何台股主動型基金，投資人為何不敢全倉買進？當投資人反駁科技股未來不一定續強時，恰恰證明了「過去報酬不必然代表未來」。\n\n[00:20:49] 擇時換股的超高難度與動能因子的客觀工具：分析散戶常抱持的「現在買會漲的，等不漲再換」心理，實質上是在進行難度極高的雙向擇時（高點賣出 A 且精準買進剛要起漲的 B），如同無數自以為能逢高出場的美債投資人最終全數被套牢。若真心相信「強者恆強、過去會漲的未來會繼續漲」，應當選擇有機械化規則剔除轉弱標的的動能因子 ETF（如美股 SPMO），而非主觀賭博經理人的個人狀態。\n\n[00:25:53] 規模是報酬的敵人與槓桿工具的內扣細節：引用巴菲特名言「規模是投資報酬的最大敵人」，指出當 00981A 等基金規模迅速膨脹至數千億甚至挑戰破兆時，將面臨極嚴重的策略胃納量上限與流動性衝擊。同時在 QA 環節澄清海外槓桿 ETF（SSO / QLD）以 Swap 交換合約為主，而台股 00670L 則因期貨轉倉正價差與匯率避險成本重疊，長期追蹤誤差顯著落後於美股原型。\n\n[00:35:10] 《選擇障礙世代》的啟發與長期承諾的真正力量：推薦影劇《法官李漢音》與日劇《求婚大作戰》，並精讀《選擇障礙世代》一書。現代人在串流平台陷入「無限瀏覽模式」，因害怕後悔、害怕連接、害怕錯過等三大恐懼而不願做出承諾。然而，真正的長期價值（如攜手數十年的金婚老夫妻、長期持有的複利資產）都源自於對抗選擇誘惑、在低谷中彼此修復與堅持承諾的堅毅心性。", "top10": ["當你真心渴望做好一件事，不要等待熱情降臨，而是立刻動手排除眼前的微小阻礙 [00:07:05]。", "熱情是手頭把事做順、獲得正向成就感後的副產物，而非行動的前提條件 [00:08:29]。", "親身經歷過高達 7% 高利負債深淵的人，比任何人都更重視槓桿的安全邊際與風險控制 [00:10:44]。", "盲目以過去高報酬作為買進主動基金的唯一依據，是標準忽視倖存者偏差的危險思維 [00:17:35]。", "若只看過去報酬，兩倍半導體 USD 與三倍 SOXL 報酬破萬百分比，不敢買恰恰證明你深知過去不代表未來 [00:18:13]。", "「不漲就換另一檔」是極難實現的雙向擇時幻覺，絕大多數散戶只會落得兩面挨耳光的下場 [00:21:07]。", "若堅信強者恆強，應選擇客觀剔除弱者的動能因子 ETF（如 SPMO），而非主觀押注經理人運氣 [00:23:46]。", "規模是報酬的敵人，主動型基金一旦規模膨脹至數千億，其超額報酬優勢將面臨嚴重策略胃納量上限 [00:25:57]。", "現代人陷入「無限瀏覽模式」，因為害怕錯過與害怕後悔，反而失去了深耕長期承諾的複利能力 [00:36:24]。", "世上所有令人感動的長久價值（無論是金婚伴侶還是複利資產），都必須挺過低谷期的溝通與堅守 [00:39:33]。"], "books": ["《牧羊少年奇幻之旅》作者：保羅·科爾賀（Paulo Coelho）。名言：「當你真心渴望追求某種事物的話，整個宇宙都會聯合起來協助你完成」[00:07:12]。", "《選擇障礙世代》（The Generation of Option Paralysis）。剖析現代人因選擇過剩陷入「無限瀏覽模式」，詳解害怕後悔、害怕連接、害怕錯過的三                 researchHtml = `<ul class="data-list">${ep.research_data.map(r => `<li>${r}</li>`).join("")}</ul>`;
            } else {
                researchHtml = `<p class="empty-placeholder">本集無此項目內容</p>`;
            }


            // Cases HTML
            let casesHtml = "";
            if (ep.cases && ep.cases.length > 0 && ep.cases[0].detail !== "本集無此項目內容") {
                casesHtml = `
                    <div class="data-table-container">
                        <table class="styled-table">
                            <thead>
                                <tr>
                                    <th style="width:28%;">情境說明</th>
                                    <th>詳細分析與財務含義</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${ep.cases.map(c => `<tr><td><strong>${c.scenario}</strong></td><td>${c.detail}</td></tr>`).join("")}
                            </tbody>
                        </table>
                    </div>
                `;
            } else {
                casesHtml = `<p class="empty-placeholder">本集無此項目內容</p>`;
            }


            // Terms HTML
            let termsHtml = "";
            if (ep.terms && ep.terms.length > 0 && ep.terms[0].desc !== "本集無此項目內容") {
                termsHtml = `
                    <div class="concepts-grid">
                        ${ep.terms.map(t => `
                            <div class="concept-card">
                                <h4>${t.term}</h4>
                                <p>${t.desc}</p>
                            </div>
                        `).join("")}
                    </div>
                `;
            } else {
                termsHtml = `<p class="empty-placeholder">本集無此項目內容</p>`;
            }


            // Top 10 HTML
            let top10Html = "";
            if (ep.top10 && ep.top10.length > 0) {
                top10Html = `<ol class="top-list">${ep.top10.map(item => `<li>${item}</li>`).join("")}</ol>`;
            } else {
                top10Html = `<p class="empty-placeholder">本集無此項目內容</p>`;
            }


            contentContainerEl.innerHTML = `
                <article>
                    <!-- Header -->
                    <div class="article-header">
                        <div class="ep-headline-badge">
                            <span class="cat-pill-hero">${ep.category_name}</span>
                            <span style="font-family:'JetBrains Mono',monospace;font-size:0.85rem;color:var(--text-muted);">
                                EPISODE #${ep.ep}
                            </span>
                        </div>
                        <h1 class="article-title">${ep.title}</h1>
                        <div class="article-quick-nav">
                            <button class="btn" id="copyShareBtn">🔗 複製本集分享連結</button>
                            <div style="font-size:0.82rem;color:var(--text-muted);">嚴格依照 7 大核心項目結構整理</div>
                        </div>
                    </div>


                    <!-- 1. 本集大綱 -->
                    <section class="article-section">
                        <div class="section-header-title">
                            <div class="title-left"><span class="icon">📌</span> 1. 本集大綱</div>
                        </div>
                        <p class="summary-text">${ep.outline}</p>
                    </section>


                    <!-- 2. 章節精讀 -->
                    <section class="article-section">
                        <div class="section-header-title">
                            <div class="title-left"><span class="icon">📖</span> 2. 章節精讀</div>
                            <span class="word-count-tag">精讀字數：${deepDiveLength} 字 (≥ 500字)</span>
                        </div>
                        <div class="deep-dive-text">${ep.deep_dive}</div>
                    </section>


                    <!-- 3. 本集核心 Top 10 -->
                    <section class="article-section">
                        <div class="section-header-title">
                            <div class="title-left"><span class="icon">🔑</span> 3. 本集核心 Top 10</div>
                        </div>
                        ${top10Html}
                    </section>


                    <!-- 4. 引用書籍 -->
                    <section class="article-section">
                        <div class="section-header-title">
                            <div class="title-left"><span class="icon">📚</span> 4. 引用書籍</div>
                        </div>
                        ${booksHtml}
                    </section>


                    <!-- 5. 研究與數據 -->
                    <section class="article-section">
                        <div class="section-header-title">
                            <div class="title-left"><span class="icon">📊</span> 5. 研究與數據</div>
                        </div>
                        ${researchHtml}
                    </section>


                    <!-- 6. 案例 -->
                    <section class="article-section">
                        <div class="section-header-title">
                            <div class="title-left"><span class="icon">💼</span> 6. 案例</div>
                        </div>
                        ${casesHtml}
                    </section>


                    <!-- 7. 重要名詞 -->
                    <section class="article-section">
                        <div class="section-header-title">
                            <div class="title-left"><span class="icon">🧠</span> 7. 重要名詞</div>
                        </div>
                        ${termsHtml}
                    </section>


                    <!-- Pager -->
                    <div class="bottom-pager">
                        ${prevEp ? `<button class="btn" onclick="selectEpisode('${prevEp.id}')">⬅ 上一集：EP.${prevEp.ep}</button>` : `<div></div>`}
                        ${nextEp ? `<button class="btn btn-primary" onclick="selectEpisode('${nextEp.id}')">下一集：EP.${nextEp.ep} ➡</button>` : `<div></div>`}
                    </div>
                </article>
            `;


            const copyShareBtn = document.getElementById("copyShareBtn");
            if (copyShareBtn) {
                copyShareBtn.addEventListener("click", () => {
                    const shareUrl = window.location.origin + window.location.pathname + "#" + ep.id;
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        copyShareBtn.textContent = "✅ 已複製連結！";
                        setTimeout(() => { copyShareBtn.textContent = "🔗 複製本集分享連結"; }, 2000);
                    });
                });
            }
        }


        function setupEventListeners() {
            searchInput.addEventListener("input", (e) => {
                searchQuery = e.target.value;
                clearSearchBtn.style.display = searchQuery ? "block" : "none";
                renderSidebar();
            });


            clearSearchBtn.addEventListener("click", () => {
                searchInput.value = "";
                searchQuery = "";
                clearSearchBtn.style.display = "none";
                renderSidebar();
            });


            categoryBar.addEventListener("click", (e) => {
                if (e.target.classList.contains("filter-pill")) {
                    document.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
                    e.target.classList.add("active");
                    activeCategory = e.target.getAttribute("data-cat");
                    renderSidebar();
                }
            });


            themeToggle.addEventListener("click", () => {
                const cur = document.documentElement.getAttribute("data-theme");
                applyTheme(cur === "dark" ? "light" : "dark");
            });


            menuToggle.addEventListener("click", () => {
                sidebar.classList.toggle("open");
                sidebarOverlay.classList.toggle("active");
            });


            sidebarOverlay.addEventListener("click", () => {
                sidebar.classList.remove("open");
                sidebarOverlay.classList.remove("active");
            });


            window.addEventListener("hashchange", () => {
                const hashId = window.location.hash.replace("#", "");
                if (hashId && hashId !== currentEpisodeId && EPISODES.some(e => e.id === hashId)) {
                    selectEpisode(hashId);
                }
            });
        }


        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
